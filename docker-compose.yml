# CC3084 - Lab 8: DuckDB
#
#   docker compose up --build
#
# La primera construccion descarga varios cientos de MB y puede tardar.
#
# LAB8_DATA_DIR (opcional, en un archivo .env junto a este archivo) permite
# guardar los datos fuera del repositorio, p. ej. fuera de carpetas
# sincronizadas como OneDrive. Por defecto se usa ./data. En cualquier caso,
# dentro de los contenedores los datos quedan en /workspace/data.

services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab8-lab
    working_dir: /workspace
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ${LAB8_DATA_DIR:-./data}:/workspace/data
      - ./notebooks:/workspace/notebooks
      - ./scripts:/workspace/scripts
      - ./sql:/workspace/sql
      - ./docs:/workspace/docs
    restart: unless-stopped

  metabase:
    build:
      context: .
      dockerfile: metabase.Dockerfile
    container_name: lab8-metabase
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - metabase-data:/home/metabase/data
      - ${LAB8_DATA_DIR:-./data}:/workspace/data
    environment:
      - MB_DB_FILE=/home/metabase/data/metabase.db
    restart: unless-stopped

volumes:
  metabase-data:
